suite: "fact_sales_golden"
version: "v1"
connection_env: "SYNAPSE_UAT_CONN_STR"

checks:
  - id: "fact_sales_matches_pivot_table"
    category: "business_logic"
    description: "dbo.fact_sales 按品类汇总的收入和笔数必须与你在pivot table里核对过的数字一致"
    severity: "blocker"
    type: "golden_rows"
    params:
      sql: "SELECT product_category, revenue, txn_count FROM dbo.fact_sales"
      key_columns: ["product_category"]
      measures:
        revenue: {tolerance_abs: 1}
        txn_count: {tolerance_abs: 0}
      expected:
        # Matches infra/seed_schema.sql exactly -- hand-computable from that
        # seed data, the same way you'd check these in a pivot table.
        - {product_category: "Electronics", revenue: 3000.00, txn_count: 3}
        - {product_category: "Groceries", revenue: 500.00, txn_count: 2}
        - {product_category: "Apparel", revenue: 250.00, txn_count: 2}
