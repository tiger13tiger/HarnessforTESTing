name: UAT Data Validation Gate

# This is the validation-only gate: it deploys/validates against UAT and
# fails the PR if the data doesn't match. It does NOT run the auto-fix loop --
# that runs locally (harness/evolve_cli.py) before you open the PR. Keeping
# the LLM-driven fix loop out of CI means every change going into main was
# already reviewed by a human as a normal pull request.

on:
  pull_request:
    paths:
      - "procs/**.sql"
      - "tests/**.yaml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Microsoft ODBC driver for SQL Server
        run: |
          curl -sSL -O https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests (no Synapse connection needed)
        run: python -m pytest -q

      - name: Run the validation suite against UAT
        env:
          SYNAPSE_UAT_CONN_STR: ${{ secrets.SYNAPSE_UAT_CONN_STR }}
        run: python -m harness.cli --config tests/uat_suite.example.yaml --conn-env SYNAPSE_UAT_CONN_STR
