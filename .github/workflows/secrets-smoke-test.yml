name: Secrets smoke test

# Confirms the four secrets this pipeline depends on -- SYNAPSE_DEV_CONN_STR,
# SYNAPSE_UAT_CONN_STR, DEEPSEEK_API_KEY, GH_PAT -- actually authenticate,
# instead of finding out mid-pipeline (sometimes days later) that one went
# stale, e.g. after an Azure SQL password rotation, or was never set
# correctly to begin with. Run it manually right after touching any of these
# in Settings -> Secrets; the daily schedule catches drift you didn't cause
# yourself. See harness/secrets_check.py for what each check actually does --
# all four are read-only (a trivial SELECT, a GET request): nothing here
# deploys, pushes, or spends a real LLM call.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Microsoft ODBC driver for SQL Server
        run: |
          curl -sSL -O https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the smoke test
        env:
          SYNAPSE_DEV_CONN_STR: ${{ secrets.SYNAPSE_DEV_CONN_STR }}
          SYNAPSE_UAT_CONN_STR: ${{ secrets.SYNAPSE_UAT_CONN_STR }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python -m harness.secrets_check
