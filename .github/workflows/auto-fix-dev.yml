name: Auto-fix dev (reusable)

# Shared retry step, called by promote-dev-to-uat.yml from two different
# failure points:
#   - the "promote" job (candidate rejected before it ever reached uat)
#   - the "validate-after-merge" job (something about the merged uat state
#     didn't hold up, even though the candidate alone passed moments earlier)
#
# Either way: send the failure back to an LLM against the dev database, and
# if it converges, push the fix to dev -- which re-triggers
# promote-dev-to-uat.yml fresh, restarting the whole dev -> uat cycle. Capped
# at 3 rounds TOTAL across both callers (tracked via a "[auto-fix round
# N/3]" tag on the dev commit -- every run, from either caller, is a
# separate job with no other shared state) so an unfixable procedure stops
# and waits for a human instead of looping forever.
#
# IMPORTANT: the final push uses a PAT (secrets.GH_PAT), not the default
# GITHUB_TOKEN. GitHub Actions deliberately does not let a push authenticated
# with the default GITHUB_TOKEN trigger another workflow run (anti-recursion
# guard) -- so without a PAT here, this job's push to dev would succeed but
# silently never re-trigger promote-dev-to-uat.yml, and the retry loop would
# just stop with no error and no second attempt. Create a classic or
# fine-grained PAT with write access to this repo's contents and store it as
# the GH_PAT repo secret.
#
# Loops over procs/manifest.yaml so a manifest with more than one procedure
# gets every failing one sent to the LLM in this one job -- a partial
# convergence (some fixed, some not) still commits and pushes whatever did
# converge, so the next round only has to retry what's left. Every attempt,
# converged or not, is logged to reports/metrics_log.jsonl (harness/
# metrics_log.py) for later success-rate/cost trend analysis
# (harness/metrics_cli.py) -- that log always gets committed even when no
# procedure actually changed, since the failure itself is the data point
# that matters for drift detection; it deliberately does NOT live under
# procs/**.sql or tests/**.yaml, so a metrics-only push never by itself
# re-triggers promote-dev-to-uat.yml.
#
# DeepSeek is a China-based provider; harness/governance_check.py blocks
# this job before it ever calls the LLM unless
# infra/deepseek_governance_approval.yaml has a real, filled-in sign-off --
# see that file for why.

on:
  workflow_call:

permissions:
  contents: write

jobs:
  auto-fix-and-retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Microsoft ODBC driver for SQL Server
        run: |
          curl -sSL -O https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine round number
        id: round
        run: |
          LAST_SUBJECT="$(git log -1 --pretty=%s)"
          LAST_ROUND="$(echo "$LAST_SUBJECT" | grep -oP '\[auto-fix round \K[0-9]+(?=/3\])' || true)"
          if [ -z "$LAST_ROUND" ]; then
            NEXT_ROUND=1
          else
            NEXT_ROUND=$((LAST_ROUND + 1))
          fi
          if [ "$NEXT_ROUND" -gt 3 ]; then
            echo "::error::Auto-fix cap reached (3/3) without a passing UAT run. Stopping for human review."
            exit 1
          fi
          echo "next_round=$NEXT_ROUND" >> "$GITHUB_OUTPUT"

      - name: Check DeepSeek governance approval
        run: python -m harness.governance_check

      - name: Ask the LLM to fix each failing procedure against DEV
        env:
          SYNAPSE_DEV_CONN_STR: ${{ secrets.SYNAPSE_DEV_CONN_STR }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          FAILED=0
          while IFS=$'\t' read -r proc suite exec_stmt schema; do
            echo "::group::$proc"
            OUTPUT_DIR="reports/$(basename "$proc" .sql)"
            python -m harness.evolve_cli \
              --proc "$proc" \
              --exec-statement "$exec_stmt" \
              --suite "$suite" \
              --allowed-schema "$schema" \
              --conn-env SYNAPSE_DEV_CONN_STR \
              --provider deepseek \
              --output-dir "$OUTPUT_DIR" || FAILED=1
            python -m harness.metrics_log \
              --log reports/metrics_log.jsonl \
              --proc "$proc" \
              --round "${{ steps.round.outputs.next_round }}" \
              --evolve-summary "$OUTPUT_DIR/evolve_summary.json"
            echo "::endgroup::"
          done < <(python -m harness.manifest procs/manifest.yaml --tsv)
          exit $FAILED

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-fix-report
          path: reports/
          if-no-files-found: ignore

      - name: Commit and push whatever converged back to dev
        # Always runs, even if the LLM step above failed for some procedures --
        # a partial convergence (some fixed, some not) still commits and pushes
        # what did converge, and the metrics log entry gets recorded either way.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Auto-fix after UAT rejection [auto-fix round ${{ steps.round.outputs.next_round }}/3]" > /tmp/commit_message.txt

          while IFS=$'\t' read -r proc suite exec_stmt schema; do
            if git diff --quiet -- "$proc"; then
              continue
            fi
            git add "$proc"
            OUTPUT_DIR="reports/$(basename "$proc" .sql)"
            {
              echo ""
              echo "## $proc"
              echo "LLM-generated fix via evolve_cli.py --provider deepseek -- not reviewed by a human before landing on dev (by design; that happens at the uat -> main PR). Rationale from the LLM:"
              echo ""
              python -m harness.rationale_cli "$OUTPUT_DIR/evolve_summary.json"
            } >> /tmp/commit_message.txt
          done < <(python -m harness.manifest procs/manifest.yaml --tsv)

          git add reports/metrics_log.jsonl 2>/dev/null || true

          {
            echo ""
            echo "Full iteration history: the auto-fix-report artifact on this workflow run."
          } >> /tmp/commit_message.txt

          if git diff --cached --quiet; then
            echo "Nothing staged -- no procedure changed and no new metrics log entry; nothing to push."
            exit 0
          fi

          git commit -F /tmp/commit_message.txt
          git push origin HEAD:dev
