name: Promote dev -> uat (automatic)

# Fully automated, by design: deploys the dev-validated procedure to UAT, runs
# the validation suite there, and -- only if it passes -- merges `dev` into
# `uat` and pushes. There is NO human review in this step; the human review
# gate in this pipeline is uat -> prd (uat-to-prd-gate.yml), not this one.
#
# If you later add branch-protection rules on `uat` that require a review,
# this direct push will start failing: either exempt this workflow's token
# from that rule, or switch the last step to open a PR and auto-merge it
# instead of pushing directly.
#
# NOTE: this workflow hardcodes one proc/suite/exec-statement as a worked
# example. With more than one stored procedure under test, replace the
# "Deploy to UAT and validate" step with a loop over a manifest file that
# maps each procs/*.sql to its suite and EXEC statement.
#
# Two things can fail here, and both retry the same way: a rejected
# candidate before it ever reaches uat ("promote"), or a re-check of the
# actually-merged uat state right after the merge ("validate-after-merge").
# Either failure calls auto-fix-dev.yml (a reusable workflow) to send the
# problem back to an LLM against dev and push a fix, sharing one 3-round
# cap between them. A pass on validate-after-merge means uat is confirmed
# good; a human still opens the uat -> main PR and merges it whenever
# they're ready -- that part stays manual.

on:
  push:
    branches: [dev]
    paths:
      - "procs/**.sql"
      - "tests/**.yaml"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Microsoft ODBC driver for SQL Server
        run: |
          curl -sSL -O https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Deploy to UAT and validate
        env:
          SYNAPSE_UAT_CONN_STR: ${{ secrets.SYNAPSE_UAT_CONN_STR }}
        run: |
          python -m harness.promote_cli \
            --proc procs/sp_refresh_fact_sales.example.sql \
            --exec-statement "EXEC dbo.sp_refresh_fact_sales" \
            --suite tests/golden_fact_sales.example.yaml \
            --allowed-schema dbo \
            --conn-env SYNAPSE_UAT_CONN_STR

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-promotion-report
          path: reports/
          if-no-files-found: ignore

      - name: Merge dev into uat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin uat
          git checkout uat
          git merge --no-ff origin/dev -m "Auto-merge dev into uat: validated against UAT"
          git push origin uat

  # Runs only when the promote job above failed (UAT rejected the candidate
  # before it ever reached uat). See auto-fix-dev.yml for what this does.
  auto-fix-and-retry:
    needs: promote
    if: failure()
    uses: ./.github/workflows/auto-fix-dev.yml
    secrets: inherit

  # Runs only when promote succeeded, i.e. only after dev was actually
  # merged into uat. Re-deploys and re-validates against UAT using uat's own
  # branch state -- not just the dev candidate promote already checked a
  # moment ago -- so a merge-specific surprise (a conflict resolved oddly, a
  # database that drifted between the two checks) still gets caught before a
  # human ever opens a uat -> main PR.
  validate-after-merge:
    needs: promote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: uat
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Microsoft ODBC driver for SQL Server
        run: |
          curl -sSL -O https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Re-validate the merged uat branch against UAT
        env:
          SYNAPSE_UAT_CONN_STR: ${{ secrets.SYNAPSE_UAT_CONN_STR }}
        run: |
          python -m harness.promote_cli \
            --proc procs/sp_refresh_fact_sales.example.sql \
            --exec-statement "EXEC dbo.sp_refresh_fact_sales" \
            --suite tests/golden_fact_sales.example.yaml \
            --allowed-schema dbo \
            --conn-env SYNAPSE_UAT_CONN_STR

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-post-merge-validation-report
          path: reports/
          if-no-files-found: ignore

  # Runs only when validate-after-merge above failed -- specifically its OWN
  # result, not failure() (which checks the whole upstream chain: promote
  # failing would make validate-after-merge get skipped, and failure()
  # still returns true for a skipped ancestor-failure, firing this job
  # alongside auto-fix-and-retry above for the same promote failure -- a
  # real race, caught by testing this for real, both jobs pushing a fix to
  # dev at once). needs.validate-after-merge.result == 'failure' only
  # matches validate-after-merge's own failure. Same shared retry as
  # auto-fix-and-retry above -- see auto-fix-dev.yml -- just triggered from
  # the post-merge check instead of the pre-merge one. Dev keeps iterating;
  # a converged fix pushes to dev and re-triggers this workflow, which
  # re-merges into uat on its next clean pass. uat is never reverted here --
  # the next successful merge simply supersedes it.
  auto-fix-and-retry-from-uat:
    needs: validate-after-merge
    if: needs.validate-after-merge.result == 'failure'
    uses: ./.github/workflows/auto-fix-dev.yml
    secrets: inherit
