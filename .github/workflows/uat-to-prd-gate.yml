name: UAT -> PRD Gate (human-reviewed)

# This is the ONE manual gate in the pipeline: a pull request from `uat` into
# `main` (= prd). dev -> uat is fully automated (see promote-dev-to-uat.yml);
# this step is deliberately not. It re-validates against UAT so the test
# analyst reviewing the PR sees a fresh pass/fail, but merging is a human
# decision -- nothing here auto-merges.

on:
  pull_request:
    branches: [main]

# Deliberately NO paths filter here, unlike promote-dev-to-uat.yml -- this
# job is a required status check in main's branch-protection ruleset. A
# required check that only runs when procs/**.sql or tests/**.yaml changes
# never reports anything on a docs/code-only PR, and GitHub shows that PR as
# permanently "Expected -- waiting for status to be reported": there's
# nothing to wait for, since the workflow structurally can't fire. This
# workflow always runs instead, and the "Check whether this PR touches
# procs/tests" step below decides internally whether there's anything to
# actually validate -- so the job always posts a real pass, not a forever-
# pending check.

permissions:
  contents: read
  pull-requests: write

# A new push to the PR branch makes the in-flight validation of the old
# commit pointless -- cancel it instead of letting it finish and post a
# stale pass/fail.
concurrency:
  group: uat-to-prd-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether this PR touches procs/**.sql or tests/**.yaml
        id: filter
        run: |
          CHANGED="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          echo "Changed files in this PR:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(procs/.*\.sql|tests/.*\.yaml)$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Nothing to validate -- no procs/tests change in this PR
        if: steps.filter.outputs.relevant == 'false'
        run: |
          echo "No procs/**.sql or tests/**.yaml changed in this PR, so there's nothing for a live UAT re-validation to check. Passing this required check on that basis, instead of leaving it permanently pending -- see this workflow's top-of-file comment for why that matters."

      - uses: actions/setup-python@v5
        if: steps.filter.outputs.relevant == 'true'
        with:
          python-version: "3.12"

      - name: Install the Microsoft ODBC driver for SQL Server
        if: steps.filter.outputs.relevant == 'true'
        run: |
          curl -sSL -O https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: Install dependencies
        if: steps.filter.outputs.relevant == 'true'
        run: pip install -r requirements.txt

      - name: Run unit tests (no Synapse connection needed)
        if: steps.filter.outputs.relevant == 'true'
        run: python -m pytest -q

      - name: Re-validate against UAT (every procedure in the manifest)
        if: steps.filter.outputs.relevant == 'true'
        env:
          SYNAPSE_UAT_CONN_STR: ${{ secrets.SYNAPSE_UAT_CONN_STR }}
        run: |
          FAILED=0
          while IFS=$'\t' read -r proc suite exec_stmt schema; do
            echo "::group::$suite"
            python -m harness.cli \
              --config "$suite" \
              --conn-env SYNAPSE_UAT_CONN_STR \
              --output-dir "reports/$(basename "$proc" .sql)" || FAILED=1
            echo "::endgroup::"
          done < <(python -m harness.manifest procs/manifest.yaml --tsv)
          exit $FAILED

      - name: Upload report
        if: always() && steps.filter.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: uat-validation-report
          path: reports/
          if-no-files-found: ignore

      - name: Flag any LLM auto-fix commits in this PR for the reviewer
        # Runs regardless of whether validation above passed -- the reviewer should
        # see this either way. Upserts one comment (keyed by the HTML marker below)
        # instead of posting a fresh one on every push to the PR branch.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          MARKER="<!-- auto-fix-summary -->"
          COMMITS_JSON="$(gh api "repos/$REPO/pulls/$PR_NUMBER/commits")"
          AUTO_FIX_COUNT="$(echo "$COMMITS_JSON" | jq '[.[] | select(.commit.message | test("\\[auto-fix round"))] | length')"

          if [ "$AUTO_FIX_COUNT" -eq 0 ]; then
            echo "No auto-fix commits in this PR; nothing to flag."
            exit 0
          fi

          {
            echo "$MARKER"
            echo "## 🤖 This PR contains $AUTO_FIX_COUNT LLM-generated fix(es)"
            echo ""
            echo "At least one commit here was written by \`harness/evolve_cli.py\`'s auto-fix loop, not a human, before it ever reached this PR -- that's what \`dev -> uat\` automation does by design. Review these like any other diff before merging:"
            echo ""
            echo "$COMMITS_JSON" | jq -r '.[] | select(.commit.message | test("\\[auto-fix round")) | "<details><summary><code>" + (.sha[0:7]) + "</code> " + (.commit.message | split("\n")[0]) + "</summary>\n\n" + (.commit.message) + "\n\n</details>\n"'
            echo ""
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > /tmp/auto_fix_summary.md

          EXISTING_ID="$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n1)"
          if [ -n "$EXISTING_ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING_ID" -f body="@/tmp/auto_fix_summary.md"
          else
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/auto_fix_summary.md
          fi
